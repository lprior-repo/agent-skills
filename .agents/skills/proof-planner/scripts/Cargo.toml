[package]
name = "proof-planner-validate"
version = "0.1.0"
edition = "2021"
description = "Deterministic gate runner for proof-planner plan directories"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
thiserror = "1"

[[bin]]
name = "validate-plan"
path = "src/main.rs"

[[bin]]
name = "quick-validate"
path = "src/quick_validate.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
